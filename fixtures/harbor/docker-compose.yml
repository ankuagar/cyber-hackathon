services:
  worker:
    image: harbor/archive-worker:1.2.0
    network_mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /etc:/host-etc
    environment:
      CLOUD_API_KEY: "demo-cloud-key"
    depends_on:
      - objects

  objects:
    image: minio/minio:RELEASE.2023-01-02T09-00-00Z
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: ["server", "/data"]

  admin:
    image: harbor/archive-admin:1.2.0
    ports:
      - "9001:9001"
    depends_on:
      - objects

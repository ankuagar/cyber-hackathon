services:
  api:
    image: northwind/checkout-api:latest
    privileged: true
    user: root
    ports:
      - "8080:8080"
    environment:
      DEBUG: "true"
      ADMIN_TOKEN: "admin123"
      CORS_ORIGINS: "*"
    depends_on:
      - db
      - cache

  db:
    image: postgres:14
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

  cache:
    image: redis:7
    ports:
      - "6379:6379"
